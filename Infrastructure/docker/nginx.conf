server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx does not merge add_header across levels: a block that sets any
    # add_header inherits none from its parent. Both locations below set their
    # own Cache-Control, so server-level security headers would be silently
    # dropped from every response. They are repeated per location instead, via
    # this include, so adding a location cannot quietly lose them again.
    include /etc/nginx/snippets/security-headers.conf;

    # Hashed asset filenames can be cached indefinitely; a new build produces
    # new names.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a returning user keeps loading the
    # previous build's asset references.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: unknown paths are application routes, not 404s.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
