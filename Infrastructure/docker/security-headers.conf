# Included at every level that sets an add_header of its own, because nginx
# stops inheriting the parent's add_header directives as soon as a level
# defines one. See nginx.conf for why this is a file rather than four copies.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
