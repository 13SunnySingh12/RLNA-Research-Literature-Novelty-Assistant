name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Test
        # B2_* is deliberately unset, so the storage integration test skips
        # rather than needing cloud credentials in CI.
        run: mvn -B --file Backend/pom.xml verify
        env:
          # The suite never reaches a real database or identity provider; these
          # only satisfy the startup validation that makes the service fail fast
          # on a missing credential.
          NEON_AUTH_JWKS_URL: https://example.invalid/.well-known/jwks.json
          NEON_AUTH_ISSUER: https://example.invalid
          FASTAPI_INTERNAL_TOKEN: ci-token-long-enough-to-pass-validation
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Package
        run: mvn -B --file Backend/pom.xml -DskipTests package

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: Backend/target/surefire-reports/
          retention-days: 7

  ai-service:
    name: AI service (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: AI/requirements-dev.txt

      - name: Install
        # CPU-only torch: the default wheel pulls a multi-gigabyte CUDA stack
        # this service never uses.
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r AI/requirements-dev.txt

      - name: Test
        working-directory: AI
        run: python -m pytest -q
        env:
          ALLOWED_CALLER_TOKEN: ci-token-long-enough-to-pass-validation
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080

  migrations:
    name: Migrations apply to a clean database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rlna
          POSTGRES_PASSWORD: rlna
          POSTGRES_DB: rlna
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rlna"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Apply every migration in order
        # Catches a migration that only works against a database that already
        # has the previous schema applied by hand.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          for file in $(ls Database/migrations/V*.sql | sort -V); do
            echo "--- $file"
            PGPASSWORD=rlna psql -h localhost -U rlna -d rlna -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Check the expected tables exist
        run: |
          PGPASSWORD=rlna psql -h localhost -U rlna -d rlna -v ON_ERROR_STOP=1 -c "
            SELECT table_name FROM information_schema.tables
            WHERE table_schema = 'public' ORDER BY table_name;"

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that no .env file is tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git"
            exit 1
          fi
          echo "No .env file is tracked."

      - name: Scan tracked files for real credentials
        run: |
          # Matched on issuer-specific prefixes only. A generic
          # "user:password@host" pattern flags documentation, local compose
          # defaults and test fixtures, so a check built on it gets muted and
          # then stops being a check at all.
          # B2 application keys are 31 characters beginning with K, and their
          # key ids are 25 hex characters.
          pattern='(AIza[0-9A-Za-z_-]{30,})|(gsk_[0-9A-Za-z]{45,})|(sk-or-v1-[0-9a-f]{48,})|(npg_[0-9A-Za-z]{12,})|(-----BEGIN [A-Z ]*PRIVATE KEY-----)|(B2_APPLICATION_KEY=K[0-9A-Za-z+/]{29,})|(B2_KEY_ID=[0-9a-f]{25})'
          if git ls-files -z | xargs -0 grep -nEI "$pattern" 2>/dev/null; then
            echo "::error::A real credential appears to be committed"
            exit 1
          fi
          echo "No provider credentials found in tracked files."

      - name: Check that a hosted database password is never inline
        run: |
          # Local compose defaults are fine; a password against a hosted host is
          # not. The documented placeholders are excluded by value, so the check
          # stays meaningful instead of always failing on the template.
          hits=$(git ls-files -z \
            | xargs -0 grep -nEI 'postgres(ql)?://[^:@/[:space:]]+:[^@/[:space:]]+@[^/[:space:]]*\.(neon\.tech|amazonaws\.com|render\.com)' 2>/dev/null \
            | grep -vE '://(user|USER|username|<user>):(password|PASSWORD|<password>|pass)@' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A hosted database connection string with an inline password is committed"
            exit 1
          fi
          echo "No hosted connection strings with real inline passwords."
